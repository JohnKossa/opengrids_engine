[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "opengrids-engine"
version = "0.1.0"
description = "Model-coherent comparable-sales grids and adjustments for any AVM, via SHAP contributions and the Frisch-Waugh-Lovell theorem."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "John Kossa" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
shap = ["shap>=0.44"]                       # scikit-learn / CatBoost tree models
statsmodels = ["statsmodels>=0.14", "patsy>=0.5"]
models = ["shap>=0.44", "statsmodels>=0.14", "patsy>=0.5", "lightgbm>=4", "xgboost>=2"]
dev = ["pytest>=8", "shap>=0.44", "statsmodels>=0.14", "patsy>=0.5", "lightgbm>=4", "xgboost>=2"]

[tool.hatch.build.targets.wheel]
packages = ["src/opengrids"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["parity: compares against a local comp_adj_app checkout (skipped unless COMP_ADJ_APP is set)"]
